services:
  db:
    image: postgres:15-alpine
    container_name: agenda-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # No mapeamos el puerto 5432 al host para evitar conflictos
    # ports:
    #   - "5432:5432"
    volumes:
      - agenda_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - agenda-net

  api:
    build:
      context: .
      target: runner
      args:
        - NEXT_PUBLIC_API_URL=http://${SERVER_IP}:${PORT_API}/api/v1
    container_name: agenda-api
    restart: always
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@agenda-db:5432/${POSTGRES_DB}?schema=public"
      JWT_SECRET: ${JWT_SECRET}
      API_PORT: ${PORT_API}
      API_PREFIX: api/v1
      REDIS_URL: "redis://agenda-redis:6379"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    command: sh -c "npx prisma db push --schema=apps/api/prisma/schema.prisma && npx prisma db seed --schema=apps/api/prisma/schema.prisma && npm run start:prod --workspace=api"
    ports:
      - "${PORT_API}:${PORT_API}"
    networks:
      - agenda-net

  redis:
    image: redis:7-alpine
    container_name: agenda-redis
    restart: always
    networks:
      - agenda-net

  web:
    build:
      context: .
      target: runner
      args:
        - NEXT_PUBLIC_API_URL=http://${SERVER_IP}:${PORT_API}/api/v1
    container_name: agenda-web
    restart: always
    environment:
      NEXT_PUBLIC_API_URL: "http://${SERVER_IP}:${PORT_API}/api/v1"
      PORT: ${PORT_WEB}
    depends_on:
      - api
    command: npm start --workspace=web
    ports:
      - "${PORT_WEB}:${PORT_WEB}"
    networks:
      - agenda-net

networks:
  agenda-net:
    driver: bridge

volumes:
  agenda_db_data:
